<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video.title }} - TubeClone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fab fa-youtube text-danger"></i> TubeClone
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">
                    <i class="fas fa-arrow-left"></i> Kembali
                </a>
            </div>
        </div>
    </nav>

    <!-- Video Player -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="ratio ratio-16x9 bg-dark">
                    <video controls class="w-100 h-100">
                        <source src="{{ url_for('static', filename='../videos/' + video.filename) }}" type="video/mp4">
                        Browser Anda tidak mendukung video tag.
                    </video>
                </div>
                
                <div class="mt-3">
                    <h3>{{ video.title }}</h3>
                    <div class="d-flex justify-content-between align-items-center text-muted">
                        <span>
                            <i class="far fa-calendar"></i> {{ video.upload_date }}
                        </span>
                        <span>
                            <i class="fas fa-hdd"></i> {{ "%.2f"|format(video.file_size / 1024 / 1024) }} MB
                        </span>
                    </div>
                    <hr>
                    <p>{{ video.description or 'Tidak ada deskripsi' }}</p>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Video Lainnya</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Kembali ke beranda untuk melihat video lainnya</p>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-primary btn-sm w-100">
                            Lihat Semua Video
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
